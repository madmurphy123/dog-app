<article class="entry kd-card" *ngIf="vm as v" [class.dimmed]="done" [class.goal]="v.isGoal" [style.--accent]="v.meta.accent" [style.--tint]="v.meta.tint">
  <header class="head">
    <span class="kd-mono time">{{ v.item.time }}</span>
    <span class="kd-eyebrow kind">{{ v.meta.type }}</span>
    <span class="status" [ngSwitch]="v.kind">
      <span class="chip walk-status" *ngSwitchCase="'walk'">
        <app-icon name="leaf" [size]="14" color="var(--walk)" [stroke]="2.2"></app-icon> Sniff &amp; stroll
      </span>
      <app-arousal-indicator *ngSwitchCase="'game'" [arousal]="v.arousal || 'med'"></app-arousal-indicator>
      <span class="chip treat-status" *ngSwitchCase="'treat'">
        <app-icon name="sparkle" [size]="14" color="var(--treat)" [stroke]="2.2"></app-icon> Surprise
      </span>
      <span class="chip care-status" *ngSwitchCase="'care'">Reminder</span>
      <ng-container *ngSwitchCase="'goal'">
        <span class="chip goal-status" *ngIf="v.goal as g">Step {{ g.stepIndex + 1 }}/{{ g.total }}</span>
      </ng-container>
    </span>
  </header>

  <div class="goal-banner" *ngIf="v.goal as g">
    <app-icon name="target" [size]="14" color="var(--accent)" [stroke]="2.2"></app-icon>
    <span>Working towards · {{ g.title }}</span>
  </div>

  <div class="main">
    <span class="icon-tile">
      <app-icon [name]="v.meta.icon" [size]="24" color="var(--accent)" [stroke]="2.1"></app-icon>
    </span>
    <div class="text">
      <h3 class="kd-display title" [class.struck]="done">{{ v.item.title }}</h3>
      <p class="detail">{{ v.item.detail }}</p>

      <div class="chips" *ngIf="v.minutes || v.equipment.length">
        <span class="chip time-chip" *ngIf="v.minutes">
          <app-icon name="clock" [size]="13" color="var(--accent)" [stroke]="2.2"></app-icon> ~{{ v.minutes }} min
        </span>
        <span class="chip kit-chip" *ngFor="let e of v.equipment; trackBy: trackByIndex">{{ e }}</span>
      </div>

      <p class="twist" *ngIf="v.variation"><span class="twist-label">Twist</span> {{ v.variation }}</p>
      <p class="twist" *ngIf="v.goal as g"><span class="twist-label">Nailed it when</span> {{ g.criterion }}</p>
    </div>
  </div>

  <ul class="tasks" *ngIf="v.tasks as tasks">
    <li class="task" *ngFor="let task of tasks; trackBy: trackByIndex">
      <span class="bullet"><span class="dot"></span></span>
      <span>{{ task }}</span>
    </li>
  </ul>

  <div class="actions" *ngIf="showAction">
    <button *ngIf="v.isGoal" type="button" class="kd-btn mark goal-mark" (click)="nailed.emit()">
      <app-icon name="check" [size]="16" color="#fff" [stroke]="2.4"></app-icon> Nailed it →
    </button>
    <button *ngIf="!v.isGoal" type="button" class="kd-btn mark" [class.is-done]="done" (click)="toggleDone.emit()">
      <app-icon name="check" [size]="16" [stroke]="2.4"></app-icon>
      {{ done ? 'Done' : 'Mark as done' }}
    </button>
    <button *ngIf="v.isGame" type="button" class="kd-btn swap" (click)="swap.emit()" aria-label="Swap this activity">
      <app-icon name="shuffle" [size]="16" [stroke]="2.2"></app-icon>
    </button>
  </div>
</article>
