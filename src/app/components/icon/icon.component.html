<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  [attr.stroke]="color"
  [attr.stroke-width]="stroke"
  [style.color]="color"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <ng-container [ngSwitch]="name">
    <ng-container *ngSwitchCase="'search'">
      <circle cx="11" cy="11" r="7" />
      <path d="M21 21l-4.3-4.3" />
    </ng-container>
    <ng-container *ngSwitchCase="'menu'">
      <path d="M4 7h16M4 12h16M4 17h11" />
    </ng-container>
    <ng-container *ngSwitchCase="'plus'">
      <path d="M12 5v14M5 12h14" />
    </ng-container>
    <ng-container *ngSwitchCase="'close'">
      <path d="M6 6l12 12M18 6L6 18" />
    </ng-container>
    <ng-container *ngSwitchCase="'trash'">
      <path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13" />
    </ng-container>
    <ng-container *ngSwitchCase="'clock'">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    </ng-container>
    <ng-container *ngSwitchCase="'bell'">
      <path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7" />
      <path d="M10 20a2 2 0 004 0" />
    </ng-container>
    <ng-container *ngSwitchCase="'bellOff'">
      <path d="M6 9a6 6 0 019-5M18 9c0 6 2 7 2 7H8" />
      <path d="M4 4l16 16" />
      <path d="M10 20a2 2 0 004 0" />
    </ng-container>
    <ng-container *ngSwitchCase="'check'">
      <path d="M5 12.5l4.5 4.5L19 6.5" />
    </ng-container>
    <ng-container *ngSwitchCase="'shuffle'">
      <path d="M16 4h4v4M4 20l16-16M4 4l5 5M15 15l5 5M16 20h4v-4" />
    </ng-container>
    <ng-container *ngSwitchCase="'edit'">
      <path d="M4 20h4L19 9l-4-4L4 16v4z" />
      <path d="M14 6l4 4" />
    </ng-container>
    <ng-container *ngSwitchCase="'chevR'">
      <path d="M9 5l7 7-7 7" />
    </ng-container>
    <ng-container *ngSwitchCase="'chevL'">
      <path d="M15 5l-7 7 7 7" />
    </ng-container>
    <ng-container *ngSwitchCase="'chevD'">
      <path d="M5 9l7 7 7-7" />
    </ng-container>
    <ng-container *ngSwitchCase="'calendar'">
      <rect x="3.5" y="5" width="17" height="16" rx="3" />
      <path d="M3.5 9.5h17M8 3v4M16 3v4" />
    </ng-container>
    <ng-container *ngSwitchCase="'sun'">
      <circle cx="12" cy="12" r="4.5" />
      <path
        d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"
      />
    </ng-container>
    <ng-container *ngSwitchCase="'moon'">
      <path d="M20 14.5A8 8 0 119.5 4 6.5 6.5 0 0020 14.5z" />
    </ng-container>
    <ng-container *ngSwitchCase="'paw'">
      <circle cx="7.5" cy="10" r="1.9" fill="currentColor" stroke="none" />
      <circle cx="12" cy="8" r="1.9" fill="currentColor" stroke="none" />
      <circle cx="16.5" cy="10" r="1.9" fill="currentColor" stroke="none" />
      <path
        d="M12 12.4c-2.6 0-4.6 1.7-4.6 3.8 0 1.5 1.3 2.3 2.6 2 .8-.2 1.3-.5 2-.5s1.2.3 2 .5c1.3.3 2.6-.5 2.6-2 0-2.1-2-3.8-4.6-3.8z"
        fill="currentColor"
        stroke="none"
      />
    </ng-container>
    <ng-container *ngSwitchCase="'walk'">
      <circle cx="13" cy="4.5" r="1.8" fill="currentColor" stroke="none" />
      <path d="M12 8l-2 4 2 2v6M12 12l3 2 2-1M10 12l-2 3-3 1" />
    </ng-container>
    <ng-container *ngSwitchCase="'cart'">
      <circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none" />
      <circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none" />
      <path d="M3 4h2l2.5 12h11l2-8H6" />
    </ng-container>
    <ng-container *ngSwitchCase="'list'">
      <path d="M8 6h12M8 12h12M8 18h12" />
      <circle cx="4" cy="6" r="1" fill="currentColor" stroke="none" />
      <circle cx="4" cy="12" r="1" fill="currentColor" stroke="none" />
      <circle cx="4" cy="18" r="1" fill="currentColor" stroke="none" />
    </ng-container>
    <ng-container *ngSwitchCase="'flame'">
      <path
        d="M12 3c1 3-2 4-2 7a2 2 0 004 0c0-1 0-1.5-.3-2 1.8 1 3.3 3 3.3 5.5a5 5 0 11-10 0C7 12 12 11 12 3z"
      />
    </ng-container>
    <ng-container *ngSwitchCase="'leaf'">
      <path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z" />
      <path d="M5 19C9 14 13 11 17 9" />
    </ng-container>
    <ng-container *ngSwitchCase="'sparkle'">
      <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z" />
    </ng-container>
    <ng-container *ngSwitchCase="'pin'">
      <path d="M12 21s7-6.3 7-11a7 7 0 10-14 0c0 4.7 7 11 7 11z" />
      <circle cx="12" cy="10" r="2.5" />
    </ng-container>
    <ng-container *ngSwitchCase="'gift'">
      <rect x="4" y="9" width="16" height="11.5" rx="2" />
      <path d="M3 9h18M12 9v11.5" />
      <path d="M12 9S10.4 4.8 8.2 5.4C6.6 5.9 7.4 9 9.3 9H12zM12 9s1.6-4.2 3.8-3.6C17.4 5.9 16.6 9 14.7 9H12z" />
    </ng-container>
    <ng-container *ngSwitchCase="'droplet'">
      <path d="M12 3.5S5.5 10 5.5 14.5a6.5 6.5 0 0013 0C18.5 10 12 3.5 12 3.5z" />
    </ng-container>
    <ng-container *ngSwitchCase="'target'">
      <circle cx="12" cy="12" r="8" />
      <circle cx="12" cy="12" r="4" />
      <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none" />
    </ng-container>
  </ng-container>
</svg>
